<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Groove sway: the upper body rocks side to side from the feet. */
      .sway {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: sway 1.6s infinite ease-in-out;
      }

      /* Claws snap alternately, pivoting at the shoulder joint. */
      .claw-left {
        transform-box: fill-box;
        transform-origin: 100% 50%;
        animation: claw-left 0.8s infinite ease-in-out;
      }
      .claw-right {
        transform-box: fill-box;
        transform-origin: 0% 50%;
        animation: claw-right 0.8s infinite ease-in-out;
        animation-delay: -0.4s;
      }

      /* Relaxed, contented blink. */
      .eyes-blink {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: blink 3.2s infinite linear;
      }

      /* Pixel music notes drifting up and fading out, taking turns. */
      .note-1 { animation: note-float 3.2s infinite linear; }
      .note-2 { animation: note-float 3.2s infinite linear; animation-delay: -1.6s; }

      @keyframes sway {
        0%   { transform: translateX(-0.6px) rotate(-3deg); }
        50%  { transform: translateX(0.6px) rotate(3deg); }
        100% { transform: translateX(-0.6px) rotate(-3deg); }
      }

      @keyframes claw-left {
        0%   { transform: rotate(0deg); }
        50%  { transform: rotate(-22deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes claw-right {
        0%   { transform: rotate(0deg); }
        50%  { transform: rotate(22deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes blink {
        0%, 88%  { transform: scaleY(1); }
        92%      { transform: scaleY(0.1); }
        96%, 100% { transform: scaleY(1); }
      }

      @keyframes note-float {
        0%   { transform: translate(0, 0); opacity: 0; }
        10%  { opacity: 1; }
        45%  { opacity: 1; }
        60%  { transform: translate(1.5px, -9px); opacity: 0; }
        100% { transform: translate(1.5px, -9px); opacity: 0; }
      }
    </style>
  </defs>

  <rect id="ground-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs stay planted while the body grooves. -->
  <g id="legs-group" fill="#DE886D">
    <rect id="outer-left-leg" x="3" y="13" width="1" height="2"/>
    <rect id="inner-left-leg" x="5" y="13" width="1" height="2"/>
    <rect id="inner-right-leg" x="9" y="13" width="1" height="2"/>
    <rect id="outer-right-leg" x="11" y="13" width="1" height="2"/>
  </g>

  <g id="upper-body" class="sway">
    <g id="body-color-group" fill="#DE886D">
      <rect id="torso" x="2" y="6" width="11" height="7"/>
      <rect id="left-arm" class="claw-left" x="0" y="9" width="2" height="2"/>
      <rect id="right-arm" class="claw-right" x="13" y="9" width="2" height="2"/>
    </g>
    <g id="eyes-color-group" class="eyes-blink" fill="#000000">
      <rect id="left-eye" x="4" y="8" width="1" height="2"/>
      <rect id="right-eye" x="10" y="8" width="1" height="2"/>
    </g>
  </g>

  <!-- Music notes: a head rect plus a stem rect, rectangles only. -->
  <g id="note-1" class="note-1" fill="#60A5FA">
    <rect x="16" y="3" width="1.4" height="1.4"/>
    <rect x="17" y="0.2" width="0.5" height="3.2"/>
  </g>
  <g id="note-2" class="note-2" fill="#F472B6">
    <rect x="-3.5" y="2" width="1.4" height="1.4"/>
    <rect x="-2.5" y="-0.8" width="0.5" height="3.2"/>
  </g>
</svg>
